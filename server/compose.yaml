services:
  sync:
    build: .
    restart: unless-stopped
    ports:
      - '8787:8787'
    environment:
      # Required. Generate with: openssl rand -base64 32
      TABBARY_PAIRING_SECRET: ${TABBARY_PAIRING_SECRET:?set TABBARY_PAIRING_SECRET in .env}
      TABBARY_DB: /data/tabbary.db
      # Pairing attempts per IP per minute.
      TABBARY_PAIR_LIMIT: '5'
    volumes:
      - tabbary-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  tabbary-data:
