name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Sync server tests
        run: npm run test:server

      - name: Build
        run: npm run build

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: windrow-unpacked
          path: dist/
          retention-days: 14

  # The sync server is dependency-free (node:sqlite), so it can be linted by
  # simply starting it and asking for /health.
  server-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start the server and probe /health
        env:
          WINDROW_PAIRING_SECRET: ci-smoke-test-secret-123456
          PORT: '8899'
        run: |
          node server/index.mjs &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8899/health > /dev/null; then
              echo "healthy"
              exit 0
            fi
            sleep 0.5
          done
          echo "server did not become healthy" >&2
          exit 1

  e2e:
    runs-on: ubuntu-latest
    # Official Playwright image: Chromium and system libs are preinstalled, so
    # there is no apt/browser download step to stall on.
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-jammy
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: E2E (headless, no display required)
        run: npm run test:e2e:all
        timeout-minutes: 15

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
